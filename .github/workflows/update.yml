name: 2 - Modell ujraszamolas + oldal (kezi)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: wc26-pipeline, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Inkrementalis ujraszamolas + render
        run: python update.py
      - name: Commit
        run: |
          git config user.name "wc26-bot"; git config user.email "bot@users.noreply.github.com"
          git add index.html data/predictions.json data/performance.json
          git diff --cached --quiet || git commit -m "site: elorejelzesek frissitve"
          git pull --rebase origin main || true
          git push
