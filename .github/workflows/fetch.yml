name: 1 - Adatok betoltese (kezi)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: wc26-pipeline, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Eredmenyek + statisztikak letoltese (overlay automatikus)
        env:
          FOOTBALL_DATA_TOKEN: "${{ secrets.FOOTBALL_DATA_TOKEN }}"
          API_FOOTBALL_KEY: "${{ secrets.API_FOOTBALL_KEY }}"
        run: python scripts/fetch_data.py
      - name: Commit
        run: |
          git config user.name "wc26-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/observed.json data/player_form.json data/player_ratings_raw.json 2>/dev/null || git add data/observed.json
          git diff --cached --quiet || git commit -m "data: napi eredmenyek + statisztikak"
          git pull --rebase origin main || true
          git push
